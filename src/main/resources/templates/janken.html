<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
  <meta charset="UTF-8">
  <title>じゃんけん</title>
</head>

<body>

  <h1>じゃんけん</h1>

  <p>Hi <span sec:authentication="name"></span></p>

  <p>
    <a href="/logout">ログアウト</a>
  </p>

  <h2>エントリー</h2>

  <ul>
    <li th:each="user : ${entryUsers}">
      [[${user}]]
    </li>
  </ul>

  <p th:if="${name}">
    Hi [[${name}]]
  </p>

  <p>出す手を選んでください。</p>

  <p>
    <a href="/janken/グー">グー</a>
    <a href="/janken/チョキ">チョキ</a>
    <a href="/janken/パー">パー</a>
  </p>

  <div th:if="${janken}">
    <p>あなたの手：[[${janken.userHand}]]</p>
    <p>相手の手：[[${janken.cpuHand}]]</p>
    <p>結果：[[${janken.result}]]</p>
  </div>

</body>

</html>
