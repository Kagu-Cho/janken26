<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>じゃんけん対戦</title>
</head>

<body>

  <h1>Match</h1>

  <h2>
    [[${loginUser}]] vs [[${opponent.name}]]
  </h2>

  <p>出す手を選んでください</p>

  <p>
    <a th:href="@{/wait(id=${opponent.id},hand='Gu')}">グー</a>
    <a th:href="@{/wait(id=${opponent.id},hand='Choki')}">チョキ</a>
    <a th:href="@{/wait(id=${opponent.id},hand='Pa')}">パー</a>
  </p>

  <div th:if="${result}">
    <p>ほんだの手：[[${userHand}]]</p>
    <p>CPUの手：[[${cpuHand}]]</p>
    <p>結果：[[${result}]]</p>
  </div>

  <p>
    <a href="/janken">もどる</a>
  </p>

</body>

</html>
