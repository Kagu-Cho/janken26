<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>じゃんけんゲーム</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f0f5fa;
      text-align: center;
      padding: 50px 20px;
      color: #263b56;
    }

    h1 {
      font-size: 36px;
    }

    .hands {
      font-size: 60px;
      margin: 30px;
    }

    .button {
      display: inline-block;
      background-color: #3675d9;
      color: white;
      padding: 15px 30px;
      border-radius: 10px;
    }

    .rules {
      background-color: white;
      padding: 20px;
      margin: 30px auto;
      max-width: 450px;
      border-radius: 12px;
    }
  </style>
</head>

<body>
  <h1>じゃんけんゲーム</h1>

  <div class="hands">✊ ✌️ ✋</div>

  <p>コンピュータとじゃんけんで勝負しよう！</p>

  <form action="/janken" method="post">
    <input type="text" name="name" placeholder="名前を入力" required>
    <input type="submit" value="参加">
  </form>

  <div class="rules">
    <h2>あそびかた</h2>
    <p>
      グー・チョキ・パーから<br>
      好きな手を選んで勝負！
    </p>
  </div>
</body>

</html>
